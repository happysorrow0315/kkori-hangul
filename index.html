<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="꼬리 대모험">
  <meta name="theme-color" content="#2b2140">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>꼬리의 글자 대모험</title>
  <link rel="preload" href="fonts/Jua-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <div id="scene" class="scene"></div>
    <div id="top"></div>
  </div>
  <div id="rotate"><div>아이패드를 가로로 돌려 주세요</div></div>
  <script>
    // 하얀 화면 방지: 화면이 비었을 때 안내 + 새로 받기 버튼 (게임 기록은 지우지 않음)
    (function () {
      var lastErr = '';
      function sceneEmpty() { var s = document.getElementById('scene'); return !s || !s.children.length; }
      function fatal(msg, force) {
        if (msg) lastErr = msg;
        if (document.getElementById('fatal') || (!force && !sceneEmpty())) return;
        var d = document.createElement('div');
        d.id = 'fatal';
        d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff8ec;display:flex;align-items:center;justify-content:center;font-family:Jua,-apple-system,sans-serif;color:#5a4032;text-align:center;padding:24px';
        d.innerHTML = '<div><div style="font-size:34px;margin-bottom:10px">앗, 화면을 못 불러왔어요</div>' +
          '<div style="font-size:20px;margin-bottom:24px">게임 기록은 그대로 있어요. 아래 버튼을 눌러 주세요.</div>' +
          '<button id="fatal-reset" style="font-size:28px;padding:14px 30px;border:4px solid #5a4032;border-radius:24px;background:#ffd95e;margin:6px">새로 받기</button>' +
          '<button id="fatal-reload" style="font-size:28px;padding:14px 30px;border:4px solid #5a4032;border-radius:24px;background:#8fd0ff;margin:6px">다시 시도</button>' +
          '<div id="fatal-msg" style="font-size:14px;opacity:.6;margin-top:24px;font-family:monospace;word-break:break-all"></div></div>';
        document.body.appendChild(d);
        document.getElementById('fatal-msg').textContent = lastErr;
        document.getElementById('fatal-reload').onclick = function () { location.reload(); };
        document.getElementById('fatal-reset').onclick = function () {
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
        };
      }
      window.__fatal = fatal;
      window.addEventListener('error', function (e) {
        if (!e.message) return;
        lastErr = e.message + ' @' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '');
        setTimeout(function () { fatal(); }, 800);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        lastErr = String(r && r.message ? r.message : r);
        setTimeout(function () { fatal(); }, 800);
      });
      setTimeout(function () { if (sceneEmpty()) fatal(lastErr || '시작 화면이 열리지 않았어요'); }, 7000);
    })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
